; ===== AutoQSL settings =====

[station]
callsign = UR0XXX
name = Your Name
qth = Your City, Country
grid = AA00aa
message = Thanks for the QSO! 73 & GL

[card]
; your photo for the card background (jpg/png), next to the script.
; leave empty for a plain blue background
background = background.png

[qsl]
   ask_paper_qsl = yes
   postal_address =
       Your Name (UR0XXX)
       Street, house, apt.
       City, postal code
       COUNTRY
       
[gmail]
address = your_callsign@gmail.com
; 16-character App Password (NOT your normal Gmail password)
app_password = xxxx xxxx xxxx xxxx

[qrz]
; QRZ.com login. E-mails are returned only with a paid
; "XML Logbook Data" subscription. Leave user empty to skip QRZ.
user = UR0XXX
password = your_qrz_password

[hamqth]
; free fallback (or main source if you skip QRZ)
; free account at https://www.hamqth.com
user = UR0XXX
password = your_hamqth_password

[wsjtx]
; 127.0.0.1 if only WSJT-X + this script use UDP.
; 224.0.0.1 (multicast) if GridTracker / JTAlert also listen at the same time
address = 127.0.0.1
port = 2333

[options]
; wait this many minutes after the QSO before sending
delay_minutes = 1
; band_mode = one card per call+band+mode, call = one card per call ever, none = always
dedup = band_mode
max_per_day = 300
